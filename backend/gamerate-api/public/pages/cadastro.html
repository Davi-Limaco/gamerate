<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>GameRate — Cadastro</title>
  <link rel="stylesheet" href="../css/shared.css"/>
  <style>
    body{display:flex;align-items:center;justify-content:center;min-height:100vh;}
    .auth-box{position:relative;z-index:1;width:100%;max-width:420px;padding:20px;}
    .auth-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:40px;}
    .auth-logo{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:3px;color:var(--accent);text-align:center;display:block;margin-bottom:8px;text-decoration:none;}
    .auth-logo span{color:var(--text);}
    .auth-sub{text-align:center;font-size:14px;color:var(--muted);margin-bottom:32px;}
    .auth-footer{text-align:center;margin-top:20px;font-size:13px;color:var(--muted);}
    .auth-footer a{color:var(--accent);text-decoration:none;}
    .btn-full{width:100%;justify-content:center;}
  </style>
</head>
<body>
<div class="auth-box">
  <a href="/index.html" class="auth-logo">GAME<span>RATE</span></a>
  <p class="auth-sub">Crie sua conta gratuita</p>
  <div class="auth-card">
    <div class="form-group">
      <label>Nome de usuário</label>
      <input type="text" id="nome" placeholder="Ex: GamerPro123" required minlength="2"/>
    </div>
    <div class="form-group">
      <label>E-mail</label>
      <input type="email" id="email" placeholder="seu@email.com" required/>
    </div>
    <div class="form-group">
      <label>Senha</label>
      <input type="password" id="senha" placeholder="Mínimo 6 caracteres" required minlength="6"/>
    </div>
    <div class="form-group">
      <label>Confirmar senha</label>
      <input type="password" id="confirmSenha" placeholder="Repita a senha" required minlength="6"/>
    </div>
    <div id="errMsg" class="form-error" style="margin-bottom:12px"></div>
    <button class="btn btn-accent btn-full" id="btnCadastro">Criar Conta</button>
  </div>
  <div class="auth-footer">
    Já tem conta? <a href="/pages/login.html">Entrar</a> · <a href="/index.html">← Home</a>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
if (isLoggedIn()) window.location.href = '/index.html';

const nomeInput = document.getElementById('nome');
const emailInput = document.getElementById('email');
const senhaInput = document.getElementById('senha');
const confirmSenhaInput = document.getElementById('confirmSenha');

function validarCadastroForm() {
  const nome_usuario = nomeInput.value.trim();
  const email = emailInput.value.trim();
  const senha = senhaInput.value;
  const confirmSenha = confirmSenhaInput.value;

  let isValid = true;

  const setCustomError = (input, message) => {
    input.setCustomValidity(message);
    if (message) isValid = false;
  };

  setCustomError(nomeInput, nome_usuario.length >= 2 ? '' : 'Informe um nome com pelo menos 2 caracteres');
  setCustomError(emailInput, /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) ? '' : 'Informe um e-mail válido');
  setCustomError(senhaInput, senha.length >= 6 ? '' : 'A senha deve ter no mínimo 6 caracteres');
  setCustomError(confirmSenhaInput, senha === confirmSenha ? '' : 'As senhas devem coincidir');

  if (!isValid) {
    const invalidInput = [nomeInput, emailInput, senhaInput, confirmSenhaInput].find(input => !input.checkValidity());
    invalidInput?.reportValidity();
  }

  return isValid;
}

[nomeInput, emailInput, senhaInput, confirmSenhaInput].forEach(input => {
  input.addEventListener('input', () => {
    input.setCustomValidity('');
  });
});

document.getElementById('btnCadastro').addEventListener('click', async () => {
  const nome_usuario = document.getElementById('nome').value.trim();
  const email  = document.getElementById('email').value.trim();
  const senha  = document.getElementById('senha').value;
  const confirmSenha = document.getElementById('confirmSenha').value;
  const err    = document.getElementById('errMsg');
  err.textContent = '';

  if (!validarCadastroForm()) return;
  if (senha !== confirmSenha) {
    err.textContent = 'As senhas não conferem';
    return;
  }

  const btn = document.getElementById('btnCadastro');
  btn.textContent = 'Criando...'; btn.disabled = true;

  try {
    await api.post('/auth/cadastro', { nome_usuario, email, senha });
    window.location.href = '/pages/login.html';
  } catch (e) {
    err.textContent = e.message;
    btn.textContent = 'Criar Conta'; btn.disabled = false;
  }
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>GameRate — Meu Perfil</title>
  <link rel="stylesheet" href="../css/shared.css"/>
  <style>
    .perfil-wrap{max-width:900px;margin:0 auto;padding:40px 24px;position:relative;z-index:1;}

    /* Card principal com avatar, nome, badge e estatísticas */
    .perfil-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px;display:flex;gap:28px;align-items:center;margin-bottom:32px;flex-wrap:wrap;}
    .perfil-avatar{width:72px;height:72px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:32px;color:var(--bg);flex-shrink:0;}
    .perfil-avatar-wrap{position:relative;flex-shrink:0;}
    .perfil-avatar-wrap .avatar{font-family:'Bebas Neue',sans-serif;font-weight:400;letter-spacing:1px;border:2px solid var(--border);}
    .avatar-edit{position:absolute;right:-4px;bottom:-4px;width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--bg);border:3px solid var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;transition:transform .2s;}
    .avatar-edit:hover,.avatar-edit:focus-visible{transform:scale(1.1);outline:none;}
    .foto-preview{width:160px;height:160px;border-radius:50%;object-fit:cover;background:var(--surface2);border:2px dashed var(--border);margin:0 auto 16px;display:block;}
    .foto-preview.has-img{border-style:solid;border-color:var(--accent);}
    .foto-hint{font-size:12px;color:var(--muted);text-align:center;margin-top:8px;}
    .foto-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;}
    #fotoInput{width:100%;color:var(--muted);font-family:'Outfit',sans-serif;font-size:13px;}
    #fotoInput::file-selector-button{background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:8px 14px;margin-right:12px;font-family:'Outfit',sans-serif;cursor:pointer;}
    .perfil-info{flex:1;}
    .perfil-name{font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:1px;margin-bottom:4px;}
    .perfil-email{font-size:13px;color:var(--muted);margin-bottom:10px;}
    .perfil-badge{display:inline-block;background:rgba(232,255,71,.1);border:1px solid rgba(232,255,71,.25);border-radius:30px;padding:3px 12px;font-size:11px;font-weight:600;color:var(--accent);letter-spacing:.5px;text-transform:uppercase;}
    .perfil-stats{display:flex;gap:24px;flex-wrap:wrap;}
    .perfil-stat{text-align:center;}
    .perfil-stat-num{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--text);}
    .perfil-stat-label{font-size:11px;color:var(--muted);}

    /* Seção de avaliações */
    .secao-titulo{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1px;margin-bottom:16px;}
    .hist-list{display:flex;flex-direction:column;gap:14px;}
    .hist-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;display:flex;gap:14px;align-items:center;cursor:pointer;transition:border-color .2s;}
    .hist-card:hover{border-color:rgba(232,255,71,.2);}
    .hist-capa{width:44px;height:58px;border-radius:6px;object-fit:cover;background:var(--surface2);}
    .hist-info{flex:1;min-width:0;}
    .hist-game{font-size:14px;font-weight:600;}
    .hist-titulo{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .hist-nota{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--accent);}
    .modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;align-items:center;justify-content:center;padding:20px;}
    .modal-bg.open{display:flex;}
    .modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:28px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;}
    .modal-title{font-family:'Bebas Neue',sans-serif;font-size:26px;margin-bottom:20px;}

    @media(max-width:600px){
      .perfil-wrap{padding:24px 16px;}
      .perfil-card{justify-content:center;text-align:center;}
      .foto-actions .btn{flex:1;justify-content:center;}
      .perfil-card{padding:20px;}
      .perfil-name{font-size:28px;}
    }
  </style>
</head>
<body>
<header class="top-bar">
  <a href="/index.html" class="logo">GAME<span>RATE</span></a>
  <div class="search-wrap">
    <svg class="ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="searchInput" placeholder="Pesquisar jogos..."/>
  </div>
  <nav class="nav-links">
    <a href="/pages/catalogo.html">Jogos</a>
    <a href="/pages/perfil.html" class="auth-only" style="display:none"><span class="nav-username"></span></a>
    <a href="#" onclick="logout()" class="auth-only" style="display:none">Sair</a>
    <a href="/pages/login.html" class="guest-only">Login</a>
  </nav>
</header>

<div class="page-wrap">
  <div class="perfil-wrap">

    <!-- Card de informações do usuário -->
    <div class="perfil-card" id="perfilCard">
      <div class="empty-state" style="width:100%"><div class="empty-icon">⏳</div><p>Carregando...</p></div>
    </div>

    <!-- Lista de avaliações do usuário -->
    <div class="secao-titulo">Minhas Avaliações</div>
    <div class="hist-list" id="histList">
      <div class="empty-state"><div class="empty-icon">⏳</div><p>Carregando...</p></div>
    </div>

  </div>
</div>

<div class="modal-bg" id="editPerfilModal" onclick="if(event.target===this)this.classList.remove('open')">
  <section class="modal" role="dialog" aria-modal="true" aria-labelledby="editPerfilTitle">
    <h2 class="modal-title" id="editPerfilTitle">EDITAR PERFIL</h2>
    <form id="editPerfilForm">
      <div class="form-group"><label for="perfilNome">Nome</label><input id="perfilNome" required minlength="3" maxlength="150"/></div>
      <div class="form-group"><label for="perfilEmail">E-mail</label><input id="perfilEmail" type="email" required/></div>
      <div class="form-group"><label for="perfilSenha">Nova senha (opcional)</label><input id="perfilSenha" type="password" minlength="6" maxlength="200" autocomplete="new-password"/></div>
      <div id="perfilEditError" class="form-error" role="alert"></div>
      <div style="display:flex;gap:10px;margin-top:16px">
        <button class="btn btn-accent" id="savePerfilButton" type="submit">Salvar alterações</button>
        <button class="btn btn-ghost" type="button" onclick="document.getElementById('editPerfilModal').classList.remove('open')">Cancelar</button>
      </div>
    </form>
  </section>
</div>

<div class="modal-bg" id="fotoModal" onclick="if(event.target===this)fecharFoto()">
  <section class="modal" role="dialog" aria-modal="true" aria-labelledby="fotoTitle" style="max-width:420px">
    <h2 class="modal-title" id="fotoTitle">FOTO DE PERFIL</h2>
    <!-- enctype é informativo: o envio real é feito por fetch + FormData (ver enviarFoto) -->
    <form id="fotoForm" enctype="multipart/form-data" novalidate>
      <img id="fotoPreview" class="foto-preview" alt="Pré-visualização da foto escolhida"/>
      <div class="form-group">
        <label for="fotoInput">Escolha uma imagem</label>
        <input id="fotoInput" name="imagem" type="file" accept="image/jpeg,image/png,image/gif"/>
        <div class="foto-hint">JPEG, PNG ou GIF · até 2 MB</div>
      </div>
      <div id="fotoError" class="form-error" role="alert"></div>
      <div class="foto-actions">
        <button class="btn btn-accent" id="fotoEnviar" type="submit" disabled>Enviar foto</button>
        <button class="btn btn-danger" id="fotoRemover" type="button" style="display:none" onclick="removerFoto()">Remover foto</button>
        <button class="btn btn-ghost" type="button" onclick="fecharFoto()">Cancelar</button>
      </div>
    </form>
  </section>
</div>

<footer class="footer">
  <a href="/index.html" class="footer-logo">GAME<span>RATE</span></a>
  <div class="footer-copy">© 2025 GameRate</div>
</footer>

<script src="/js/api.js"></script>
<script>
setupNav();

// Redireciona para login se não estiver autenticado
if (!isLoggedIn()) window.location.href = '/pages/login.html?next=/pages/perfil.html';

document.getElementById('searchInput').addEventListener('keyup', e => {
  if (e.key === 'Enter') window.location.href = `/pages/catalogo.html?search=${e.target.value}`;
});

// Carrega os dados do perfil usando o id salvo no localStorage
async function loadPerfil() {
  try {
    const user = getUser();
    // Busca os dados do usuário pelo seu id na API
    const u = await api.get(`/usuarios/${user.id}`);
    fotoAtual = u.caminho_imagem || null;
    // Mantém a foto da sessão sincronizada com o banco e atualiza o cabeçalho.
    setSessionImagem(fotoAtual);
    setupNav();

    document.getElementById('perfilCard').innerHTML = `
      <div class="perfil-avatar-wrap">
        ${avatarHtml(u.nome_usuario, u.caminho_imagem, 96)}
        <button class="avatar-edit" type="button" onclick="abrirFoto()" aria-label="Alterar foto de perfil" title="Alterar foto de perfil">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        </button>
      </div>
      <div class="perfil-info">
        <div class="perfil-name">${u.nome_usuario}</div>
        <div class="perfil-email">${u.email}</div>
        <span class="perfil-badge">${u.nome_perfil}</span>
        <div style="margin-top:14px"><button class="btn btn-ghost btn-sm" onclick="abrirEdicaoPerfil()">Editar perfil</button></div>
      </div>
      <div class="perfil-stats">
        <div class="perfil-stat">
          <div class="perfil-stat-num">${u.total_avaliacoes}</div>
          <div class="perfil-stat-label">Avaliações</div>
        </div>
        <div class="perfil-stat">
          <div class="perfil-stat-num">${u.data_criacao ? new Date(u.data_criacao).toLocaleDateString('pt-BR', {month:'short', year:'numeric'}) : '—'}</div>
          <div class="perfil-stat-label">Membro desde</div>
        </div>
      </div>`;
  } catch(e) {
    toast(e.message, 'error');
  }
}

// Carrega o histórico de avaliações do usuário
async function loadHistorico() {
  try {
    const user = getUser();
    // Busca as avaliações do usuário pelo seu id na API
    const rows = await api.get(`/usuarios/${user.id}/avaliacoes`);

    if (!rows.length) {
      document.getElementById('histList').innerHTML =
        '<div class="empty-state"><div class="empty-icon">🎮</div><p>Você ainda não fez nenhuma avaliação.</p></div>';
      return;
    }

    document.getElementById('histList').innerHTML = rows.map(a => `
      <div class="hist-card" onclick="location.href='/pages/avaliacao.html?id=${a.id_avaliacao}'">
        <img class="hist-capa" src="${a.capa||''}" alt="${a.nome_jogo}" onerror="this.style.background='var(--surface2)';this.src=''">
        <div class="hist-info">
          <div class="hist-game">${a.nome_jogo}</div>
          <div class="hist-titulo">${a.titulo}</div>
          <div style="font-size:11px;color:var(--muted);margin-top:4px">${fmtDate(a.data_publicacao)}</div>
        </div>
        <div class="hist-nota">${a.nota}</div>
      </div>`).join('');
  } catch(e) {
    document.getElementById('histList').innerHTML = `<div class="empty-state"><p>Erro ao carregar avaliações.</p></div>`;
  }
}

async function abrirEdicaoPerfil() {
  try {
    const user = getUser();
    const usuario = await api.get(`/usuarios/${user.id}`);
    document.getElementById('perfilNome').value = usuario.nome_usuario;
    document.getElementById('perfilEmail').value = usuario.email;
    document.getElementById('perfilSenha').value = '';
    document.getElementById('perfilEditError').textContent = '';
    document.getElementById('editPerfilModal').classList.add('open');
  } catch (error) {
    toast(error.message, 'error');
  }
}

document.getElementById('editPerfilForm').addEventListener('submit', async event => {
  event.preventDefault();
  const button = document.getElementById('savePerfilButton');
  const error = document.getElementById('perfilEditError');
  const user = getUser();
  const payload = {
    nome_usuario: document.getElementById('perfilNome').value.trim(),
    email: document.getElementById('perfilEmail').value.trim(),
  };
  const senha = document.getElementById('perfilSenha').value;
  if (senha) payload.senha = senha;

  button.disabled = true;
  button.textContent = 'Salvando...';
  error.textContent = '';
  try {
    const usuario = await api.put(`/usuarios/${user.id}`, payload);
    // Atualiza só os dados exibidos (nome/perfil/id); o token de sessão em si
    // não muda numa edição de perfil, então é preservado com getToken().
    saveSession(getToken(), usuario.nome_usuario, usuario.nome_perfil, usuario.id_usuario, usuario.caminho_imagem);
    document.getElementById('editPerfilModal').classList.remove('open');
    toast('Perfil atualizado', 'success');
    await loadPerfil();
    setupNav();
  } catch (err) {
    error.textContent = err.message;
  } finally {
    button.disabled = false;
    button.textContent = 'Salvar alterações';
  }
});

// ───────── Foto de perfil (upload) ─────────
const FOTO_TIPOS = ['image/jpeg', 'image/png', 'image/gif'];
const FOTO_MAX_BYTES = 2 * 1024 * 1024; // 2 MB (o back-end também valida)
let fotoAtual = null;     // caminho público da foto salva (ou null)
let fotoPreviewUrl = null;

const fotoInput  = document.getElementById('fotoInput');
const fotoPreview = document.getElementById('fotoPreview');
const fotoError  = document.getElementById('fotoError');
const fotoEnviar = document.getElementById('fotoEnviar');

function limparPreview() {
  if (fotoPreviewUrl) URL.revokeObjectURL(fotoPreviewUrl);
  fotoPreviewUrl = null;
  fotoPreview.removeAttribute('src');
  fotoPreview.classList.remove('has-img');
}

function abrirFoto() {
  fotoInput.value = '';
  fotoError.textContent = '';
  fotoEnviar.disabled = true;
  limparPreview();
  // Mostra a foto atual como ponto de partida, se existir.
  if (fotoAtual) { fotoPreview.src = fotoAtual; fotoPreview.classList.add('has-img'); }
  document.getElementById('fotoRemover').style.display = fotoAtual ? '' : 'none';
  document.getElementById('fotoModal').classList.add('open');
}

function fecharFoto() {
  limparPreview();
  document.getElementById('fotoModal').classList.remove('open');
}

// Ao escolher o arquivo: valida tipo/tamanho no cliente (resposta imediata) e
// mostra a pré-visualização local, sem enviar nada ainda.
fotoInput.addEventListener('change', () => {
  const file = fotoInput.files[0];
  fotoError.textContent = '';
  fotoEnviar.disabled = true;
  limparPreview();
  if (!file) return;

  if (!FOTO_TIPOS.includes(file.type)) {
    fotoError.textContent = 'Tipo de arquivo não permitido. Envie uma imagem JPEG, PNG ou GIF.';
    fotoInput.value = '';
    return;
  }
  if (file.size > FOTO_MAX_BYTES) {
    fotoError.textContent = `Arquivo muito grande (${(file.size / 1024 / 1024).toFixed(1)} MB). O máximo é 2 MB.`;
    fotoInput.value = '';
    return;
  }
  fotoPreviewUrl = URL.createObjectURL(file);
  fotoPreview.src = fotoPreviewUrl;
  fotoPreview.classList.add('has-img');
  fotoEnviar.disabled = false;
});

// Envio: FormData + fetch. NÃO definimos Content-Type — o navegador monta o
// "multipart/form-data; boundary=..." sozinho. O token JWT vai no header
// Authorization (api.upload -> apiFetch). Foto nova -> POST; já existe -> PUT.
document.getElementById('fotoForm').addEventListener('submit', async event => {
  event.preventDefault();
  const file = fotoInput.files[0];
  if (!file) return;

  const formData = new FormData();
  formData.append('imagem', file); // mesmo nome do campo esperado pelo Multer

  fotoEnviar.disabled = true;
  fotoEnviar.textContent = 'Enviando...';
  fotoError.textContent = '';
  try {
    const { caminho } = await api.upload(fotoAtual ? 'PUT' : 'POST', '/usuarios/imagem', formData);
    setSessionImagem(caminho);
    fecharFoto();
    toast('Foto de perfil atualizada', 'success');
    await loadPerfil();   // redesenha o avatar do perfil e do cabeçalho
  } catch (err) {
    // Mensagens do servidor: 400 (tamanho/tipo), 401 (sessão expirada)...
    fotoError.textContent = err.message;
    fotoEnviar.disabled = false;
  } finally {
    fotoEnviar.textContent = 'Enviar foto';
  }
});

async function removerFoto() {
  if (!confirm('Remover sua foto de perfil?')) return;
  try {
    await api.delete('/usuarios/imagem');
    setSessionImagem(null);
    fecharFoto();
    toast('Foto removida', 'success');
    await loadPerfil();
  } catch (err) {
    fotoError.textContent = err.message;
  }
}

loadPerfil();
loadHistorico();
</script>
</body>
</html>
